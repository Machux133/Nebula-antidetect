<script>

const NATIVE = /^function [^(]*\(\)\s*\{\s*\[native code\]\s*\}$/;

function viaWorker(make, timeout = 5000) {

const base = () => location.href.replace(/[^/]*$/, '');
const blobUrl = () => URL.createObjectURL(new Blob(['importScripts(' + JSON.stringify(base() + 'snap.js') + ')'], { type: 'text/javascript' }));

function sameValue(S) {

function lies() {

function canvas() {

  let c = mk(), x = c.getContext('2d', { willReadFrequently: true });

  let d = x.getImageData(0, 0, 64, 64).data, nonuni = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i] !== 10 || d[i + 1] !== 20 || d[i + 2] !== 30 || d[i + 3] !== 255) nonuni++;
  ok('noise.canvasSolid', nonuni === 0, nonuni + ' of 4096 pixels differ from rgb(10,20,30)');
  c = mk(); x = c.getContext('2d', { willReadFrequently: true });
  d = x.getImageData(0, 0, 64, 64).data; let nz = 0; for (const v of d) if (v) nz++;
  ok('noise.canvasTransparent', nz === 0, nz + ' non-zero channel values in untouched canvas');
  const draw = () => { const c2 = mk(), x2 = c2.getContext('2d', { willReadFrequently: true }); x2.fillStyle = '#f60'; x2.fillRect(5, 5, 40, 30); x2.font = '16px Arial'; x2.fillStyle = '#069'; x2.fillText('Nebula probe 1.0', 2, 50); x2.beginPath(); x2.arc(30, 30, 20, 0, 7); x2.stroke(); return [c2, c2.toDataURL()]; };
  const [c1, u1] = draw(), [, u2] = draw();
  ok('noise.canvasTwice', u1 === u2, 'two identical drawings ' + (u1 === u2 ? 'match' : 'differ'));
  ok('noise.canvasTwiceRead', c1.toDataURL() === u1, 'same canvas read twice');
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const c3 = mk(), x3 = c3.getContext('2d', { willReadFrequently: true }); x3.drawImage(img, 0, 0);
      const a = x3.getImageData(0, 0, 64, 64).data, b = c1.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, 64, 64).data;
      let diff = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
      ok('noise.getImageVsDataURL', diff === 0, diff + ' channel values differ between getImageData and decoded toDataURL');
      res();
    };
    img.onerror = () => { add('noise.getImageVsDataURL', 'warn', 'decode failed'); res(); };
    img.src = u1;

}

function layout() {
  const el = document.getElementById('box'), r = el.getBoundingClientRect();
  const rg = document.createRange(); rg.selectNodeContents(el);
  const rr = rg.getBoundingClientRect();
  ok('noise.rects', r.width === 100 && r.height === 50 && el.offsetWidth === 100 && el.offsetHeight === 50 && (rr.width === 100 || rr.width === 0), 'gBCR ' + r.width + 'x' + r.height + ' offset ' + el.offsetWidth + 'x' + el.offsetHeight + ' Range ' + rr.width + 'x' + rr.height);
}

async function audio() {
  const O = window.OfflineAudioContext;
  const render = async (osc) => { const c = new O(1, 4410, 44100); if (osc) { const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = 1000; o.connect(c.destination); o.start(); } return (await c.startRendering()).getChannelData(0); };
  const s = await render(false); let nz = 0; for (const v of s) if (v !== 0) nz++;
  ok('noise.audioSilence', nz === 0, nz + ' non-zero samples in silent render');
  const a = await render(true), b = await render(true); let df = 0, sum = 0; for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) df++; sum += Math.abs(a[i]); }
  ok('noise.audioTwice', df === 0 && sum > 0, df + ' samples differ across identical renders, sum=' + sum.toFixed(3));
}

function fontOk(name) {
  const t = 'mmmmmmmmmmlliWw0123', c = document.createElement('canvas').getContext('2d'); let hit = false;
  for (const b of ['monospace', 'serif', 'sans-serif']) { c.font = '72px ' + b; const w0 = c.measureText(t).width; c.font = "72px '" + name + "'," + b; if (c.measureText(t).width !== w0) hit = true; }
  return hit;
}
function scrollbar() { const e = document.getElementById('sb'); return e.offsetWidth - e.clientWidth; }

async function cross(S) {

  const plat = { Windows: /^Win/, macOS: /^Mac/, Android: /^Linux/, ChromeOS: /^Linux/, Linux: /^Linux/ }[osUA];
  ok('x.platform', !!plat && plat.test(m.platform), 'UA says ' + osUA + ', navigator.platform=' + m.platform);
  if ('uad.platform' in m) ok('x.uaDataPlatform', m['uad.platform'] === osUA, 'UA ' + osUA + ' vs uaData.platform ' + m['uad.platform']);

    if (osUA === 'Windows' && /Metal/i.test(r)) bad = true;

  try { const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(new Date(Date.UTC(2024, 0, 15, 12))); const g = (t) => +p.find((x) => x.type === t).value; calc = Math.round((Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - Date.UTC(2024, 0, 15, 12)) / -60000); } catch (e) {}
  ok('x.timezone', calc === m['tz.offsetJan'], 'Intl ' + tz + ' => Jan offset ' + calc + ', Date => ' + m['tz.offsetJan']);
  try {
    const h = await (await fetch('/__headers')).json();
    ok('x.headerUA', h['user-agent'] === ua, 'header UA ' + h['user-agent']);
    const al = (h['accept-language'] || '').split(',')[0].split(';')[0].trim();
    ok('x.headerLang', al === m.language, 'Accept-Language ' + h['accept-language'] + ' vs ' + m.language);
    if (h['sec-ch-ua'] && m['uad.brands']) { const hb = [...h['sec-ch-ua'].matchAll(/"([^"]+)";v="(\d+)"/g)].map((x) => x[1] + ' ' + x[2]).sort().join(); const nb = JSON.parse(m['uad.brands']).map((b) => b.brand + ' ' + b.version).sort().join(); ok('x.headerHints', hb === nb, 'sec-ch-ua ' + h['sec-ch-ua']); }

async function automation(S) {

  ok('auto.cdpRuntime', !cdpHit, cdpHit ? 'Error.stack getter fired: Runtime.enable is active' : 'no Runtime.enable side effect');

(async () => {
  const safe = async (id, f) => { try { await f(); } catch (e) { add('harness.' + id, 'warn', 'harness error: ' + e.name + ' ' + e.message); } };
  let S = {};
  await safe('contexts', async () => { S = await contexts(); });
  await safe('same', async () => sameValue(S));
  await safe('lies', async () => lies());
  await safe('canvas', canvas); await safe('layout', async () => layout()); await safe('audio', audio);

  document.getElementById('out').replaceChildren(t);
})();
